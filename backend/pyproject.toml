[project]
name = "ecommerce-brain-backend"
version = "0.1.0"
description = "Brain de IA para ecommerces - cálculo de margen neto real y agente de decisión"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "asyncpg>=0.30.0",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.2",
    "structlog>=24.4.0",
    "email-validator>=2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]